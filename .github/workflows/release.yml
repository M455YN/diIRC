name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fork releases list the commits since the previous tag; the in-app changelog reads this body.
      - name: Generate release notes (forks)
        id: notes
        if: github.repository != 'TheStami/diIRC'
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          {
            echo 'body<<NOTES_EOF'
            git log --no-merges --pretty='- %s' "$range" | grep -v '^- chore: release' || true
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ matrix.platform }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ matrix.platform }}-

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
          shared-key: "tauri-${{ matrix.platform }}"
          save-always: true

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Taken from the app version so manual runs on a branch do not create a release named after it.
          tagName: 'v__VERSION__'
          releaseName: 'diIRC v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body || format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, github.ref_name) }}
          # Forks publish straight away: the updater reads /releases/latest, which skips drafts and prereleases.
          releaseDraft: ${{ github.repository == 'TheStami/diIRC' }}
          prerelease: ${{ github.repository == 'TheStami/diIRC' }}
          includeUpdaterJson: true
          updaterJsonKeepSignatures: true
          args: ${{ matrix.args }}
